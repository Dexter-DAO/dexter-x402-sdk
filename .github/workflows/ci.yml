name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Test self-held grant tooling
        run: node --test scripts/case-two-self-held.test.mjs scripts/case-two-reservation.test.mjs scripts/case-three-self-held.test.mjs scripts/case-three-seller-tools.test.mjs scripts/case-three-refusal.test.mjs scripts/case-three-clone-approve.test.mjs

      - name: Verify installed Tab package
        run: npm run verify:tab:package

name: Verify npm release access
on:
  push:
    branches: [codex/tab-compat-release-20260916]
    paths: [.github/workflows/npm-release-access.yml]
permissions:
  contents: read
jobs:
  verify-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify configured publisher
        run: npm whoami --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
